# Workers 部署配置（与 wrangler.toml 的 Pages 部署互斥，二选一）
# 部署：npm run build && npm run db:migrate && npx wrangler deploy -c wrangler.workers.toml
name = "cloudflare-tab-workers"
main = "worker.ts"
compatibility_date = "2025-08-16"
compatibility_flags = ["nodejs_compat"]

# 静态资产（vite 产物）：非 /api 请求由资产层响应
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

d1_databases = [
  { binding = "DB", database_name = "cloudflare-tab-db", database_id = "3ebcab90-a744-474c-b5cf-e3340c4b80f1" }
]

# Secrets（部署后设置）：
#   JWT_SECRET     登录令牌签名密钥（>=32 字节）
