# Workers 部署配置（与 wrangler.toml 的 Pages 部署互斥，二选一）
# 部署：npm run build && npm run db:migrate && npx wrangler deploy -c wrangler.workers.toml
name = "cloudflare-tab-workers"
main = "worker.ts"
compatibility_date = "2025-08-16"
compatibility_flags = ["nodejs_compat"]

# 静态资产（vite 产物）：非 /api 请求由资产层响应
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

d1_databases = [
  # TODO(部署前必改)：本地执行 `npx wrangler d1 create cloudflare-tab-db`（远端），将下方 database_id 占位替换为真实 ID
  { binding = "DB", database_name = "cloudflare-tab-db", database_id = "00000000-0000-0000-0000-000000000000" }
]

# Secrets（部署后设置）：
#   JWT_SECRET     登录令牌签名密钥（>=32 字节）
