<!doctype html>
<html lang="zh-CN">

<head>
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudFlare-tab</title>
  <meta name="description" content="CloudFlare-tab 新标签页" />
  <meta name="keywords" content="cloudflare-tab,新标签页,导航,起始页" />
  <!-- 默认纯色背景，不再预载内置壁纸（用户切到壁纸模式时经 CSS 正常加载） -->
  <!-- 勿在此预载字体：rel="preload" as="font" 的资源计入 load，一旦字体请求挂起会让标签页永久转圈；字体已由内联 @font-face + font-display:swap 正常加载，预载仅数十 ms 边际收益，不值此风险 -->
  <!-- module 脚本自带 defer 语义，置于 head 使 JS 在 HTML 首字节后即被发现下载，不等全量解析 -->
  <script type="module" src="/src/main.tsx"></script>
  <style>html { background: #12151a; }</style>
</head>

<body>
  <div id="root">
    <!-- 首屏加载骨架：让 FCP 不再等待 JS 挂载（React 挂载后整段替换） -->
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font:500 14px/1 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">正在加载…</div>
  </div>
  <noscript>
    <div style="padding:40px 24px;text-align:center;color:#fff;font-family:system-ui,sans-serif;line-height:1.6;">
      CloudFlare-tab 需要启用 JavaScript 才能使用，请在浏览器设置中开启后刷新页面。
    </div>
  </noscript>
</body>

</html>
